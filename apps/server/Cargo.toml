[package]
name = "pomodoro-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "=0.10.3"
axum = "=0.8.9"
base64 = "=0.22.1"
jsonwebtoken = { version = "=10.4.0", default-features = false, features = [
  "rust_crypto",
] }
pomodoro-db = { path = "../../crates/db" }
pomodoro-focus = { path = "../../crates/focus" }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
regex = "=1.13.1"
reqwest = { version = "=0.12.28", default-features = false, features = [
  "rustls-tls",
  "json",
] }
sea-orm = { version = "=1.1.20", default-features = false, features = [
  "macros",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "with-json",
  "with-uuid",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "net",
  "sync",
  "time",
] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
url = "=2.5.8"
utoipa = { version = "=5.4.0", features = ["uuid"] }
uuid = { version = "=1.20.0", features = ["v4", "serde"] }
