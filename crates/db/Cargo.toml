[package]
name = "pomodoro-db"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
pomodoro-focus = { path = "../focus" }
sea-orm = { version = "=1.1.20", default-features = false, features = [
  "macros",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "with-json",
  "with-uuid",
] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tracing = "=0.1.44"
url = "=2.5.8"
uuid = { version = "=1.20.0", features = ["v4", "serde"] }
